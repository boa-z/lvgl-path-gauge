name: ci

on: [push, pull_request]

env:
  UBSAN_OPTIONS: halt_on_error=1
  ASAN_OPTIONS: detect_leaks=1

jobs:
  path2d:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitize: ["", "address,undefined"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: >
          cmake -S . -B build
          ${{ matrix.sanitize != '' && '-DPATH2D_SANITIZE=ON' || '' }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Phase 4 integration target: the widget, tests and example built against
  # the exact pinned LVGL version (v9.1.0, fetched by CMake).
  lvgl-gauge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        sanitize: ["", "address,undefined"]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: >
          cmake -S . -B build -DLV_PATH_GAUGE_BUILD=ON
          ${{ matrix.sanitize != '' && '-DPATH2D_SANITIZE=ON' || '' }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The SDL2 window front-end needs libsdl2; build it and run the example with
  # the dummy video driver so the interactive path cannot rot unnoticed.
  sdl-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure
        run: >
          cmake -S . -B build -DLV_PATH_GAUGE_BUILD=ON -DLV_PATH_GAUGE_SDL=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Run the windowed example headlessly
        env:
          SDL_VIDEODRIVER: dummy
        run: ./build/examples/basic_progress/basic_progress --window --frames 20
      - name: Test
        run: ctest --test-dir build --output-on-failure
